name: CI

# Every push and pull request: checks. On main, pull requests and manual runs:
# also the web and Linux builds. On pushes to main: deploy the web build to GitHub Pages.
# Manual runs only (dev.ps1 apk): the signed phone-test APK. Phone APKs are
# batched, and releases build their own, so pushes don't pay ~10 minutes each.
# Pushes and pull requests that change only docs, top-level Markdown or the
# Claude Code config skip CI entirely (nothing in them reaches a build).
# Pushes to main and claude/** (and pull requests into them) also run the
# integration tests against a fresh throwaway Audiobookshelf container. That
# job lives here, not in _checks.yml, so a flaky image pull never blocks a
# release (release.yml calls _checks.yml only).

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  # Per event too: a push must not cancel a manual run (the phone-test APK).
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/_checks.yml

  integration:
    name: Integration tests (throwaway Audiobookshelf)
    # tool/test-server's pinned container, seeded fresh in this job, then
    # test/integration (tag abs-server) against it: what dev.ps1 server up,
    # server seed and itest do locally. The generated test credentials stay
    # in tool/test-server/.env inside this job's workspace, are masked in the
    # log and are never uploaded; the container is removed at the end.
    if: >-
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))) ||
      (github.event_name == 'pull_request' &&
        (github.base_ref == 'main' || startsWith(github.base_ref, 'claude/')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: tool/test-server/docker-compose.yml
    steps:
      - uses: actions/checkout@v5
      # Pull first, with retries: a registry hiccup shouldn't fail the run.
      - name: Pull the pinned Audiobookshelf image
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            docker compose pull --quiet && exit 0
            echo "Image pull failed (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          exit 1
      - name: Start the throwaway server (127.0.0.1:13378 only)
        run: |
          docker compose up -d
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:13378/healthcheck && { echo "server ready"; exit 0; }
            sleep 2
          done
          echo "Test server did not answer within 120 s"
          exit 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter pub get
      - name: Seed test users, books and libraries
        run: python3 tool/test-server/seed.py
      - name: Integration tests
        env:
          # A suite that can't reach the server fails here instead of skipping.
          ABS_TEST_REQUIRED: '1'
        run: |
          while IFS='=' read -r key value; do
            case "$key" in ABS_TEST_*) ;; *) continue ;; esac
            value="${value%$'\r'}"
            case "$key" in *PASSWORD*) echo "::add-mask::$value" ;; esac
            export "$key=$value"
          done < tool/test-server/.env
          flutter test --no-pub --tags abs-server --run-skipped --concurrency=1 --reporter expanded test/integration
      - name: Server log (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200 abs | sed -E 's/(token=)[^&" ]+/\1***/g'
      - name: Remove the throwaway server
        if: always()
        run: docker compose down -v --remove-orphans

  web:
    name: Web build
    needs: checks
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-pub --base-href /absorb-plus/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  linux:
    name: Linux build
    needs: checks
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    # desktop_webview_window needs WebKitGTK 4.0, available on 22.04 only.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libmpv-dev
      # Built-in Tailscale library (native/tailscale, Go + cgo).
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/tailscale/go.mod
          cache-dependency-path: native/tailscale/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: python3 tool/ci/patch_webview_linux.py
      - run: flutter build linux --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: absorb-linux
          path: build/linux/x64/release/bundle

  android:
    name: Android APK (signed, for phone testing)
    # Manual runs only (dev.ps1 apk, or gh workflow run ci.yml --ref <branch>).
    # Runs alongside checks to save time: an APK from a run whose checks
    # failed is never handed out for testing (the run shows red).
    # Needs the signing secrets, which pull requests don't get.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Built-in Tailscale library (native/tailscale/android.gradle, Go + NDK).
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/tailscale/go.mod
          cache-dependency-path: native/tailscale/go.sum
      # Keeps Gradle's dependency and build caches between runs, saved from
      # this branch too (the default saves only on main), so unchanged plugin
      # code isn't recompiled for every phone-test APK.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      # Gradle otherwise downloads two NDKs, CMake and an SDK platform on every
      # run (about 5 minutes). Same key as release.yml, so tag builds reuse it.
      - name: Cache Android NDK, CMake and SDK platform
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.0.12077973
            /usr/local/lib/android/sdk/ndk/28.*
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/platforms/android-33
          key: android-sdk-${{ hashFiles('.flutter-version', 'android/app/build.gradle.kts', 'packages/whisper_ggml_plus/android/build.gradle') }}
      # Reuses compiled Whisper C++ objects between runs (CMake picks up the
      # *_COMPILER_LAUNCHER variables set on the build step).
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-ccache-arm64
          max-size: 1G
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter pub get
      - name: Configure Android signing (permanent key)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${KEYSTORE_B64:-}" ] || { echo "Android signing secrets are missing"; exit 1; }
          KEYSTORE="$RUNNER_TEMP/absorb-upload-key.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE
          EOF
      # 64-bit ARM only (every modern phone): about a third of the compile time.
      # Releases still ship every ABI.
      - name: Build arm64 APK
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # Gradle's build cache: reuse task outputs whose inputs didn't change.
          GRADLE_OPTS: -Dorg.gradle.caching=true
        run: flutter build apk --release --no-pub --flavor github --target-platform android-arm64 --dart-define=GITHUB_BUILD=true
      - name: Verify the APK carries the permanent signing key
        run: python3 tool/ci/verify_apk_signature.py build/app/outputs/flutter-apk/*github-release*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: absorb-android-apk
          path: build/app/outputs/flutter-apk/*github-release*.apk
          retention-days: 14

  deploy-pages:
    name: Deploy web to GitHub Pages
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

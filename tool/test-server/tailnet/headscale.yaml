# Throwaway headscale (open-source Tailscale control server) for testing the
# built-in Tailscale node. Test only: never a real tailnet, never the owner's.
server_url: http://127.0.0.1:18080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false
noise:
  private_key_path: /var/lib/headscale/noise_private.key
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential
# No working relays at all: headscale insists on one DERP region, so derp.yaml
# names a dead loopback port. The nodes reach each other directly over
# loopback (TS_DEBUG_PRETENDPOINT on the server-side node), so nothing leaves
# the PC.
derp:
  server:
    enabled: false
  urls: []
  paths:
    - /etc/headscale/derp.yaml
  auto_update_enabled: false
  update_frequency: 24h
disable_check_updates: true
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
log:
  level: info
policy:
  mode: file
  path: ""
dns:
  magic_dns: true
  base_domain: tailnet.test
  override_local_dns: false
  nameservers:
    global: []
unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"
